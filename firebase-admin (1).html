<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preshy - Store Admin</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f5f1e8; color: #333; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    .panel { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    h1 { margin-bottom: 20px; color: #25130e; }
    .login-form { display: flex; flex-direction: column; gap: 12px; }
    input[type="email"], input[type="password"], input[type="text"], input[type="number"], textarea, input[type="file"] {
      padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; font-family: inherit;
    }
    textarea { resize: vertical; min-height: 80px; }
    button { padding: 12px 20px; background: #ff5c8d; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 1rem; }
    button:hover { background: #f0306d; }
    .hidden { display: none; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    label { font-weight: 600; }
    .status { padding: 12px; border-radius: 8px; margin-bottom: 20px; }
    .status.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .products-list { margin-top: 20px; }
    .product-item { background: #f9f9f9; padding: 12px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .product-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
    .product-info { flex: 1; margin-left: 12px; }
    .product-info h3 { margin-bottom: 4px; }
    .product-info p { font-size: 0.9rem; color: #666; }
    .btn-group { display: flex; gap: 8px; }
    button.secondary { background: #6f6f6f; }
    button.secondary:hover { background: #555; }
    button.danger { background: #dc3545; }
    button.danger:hover { background: #c82333; }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel">
      <!-- Login Panel -->
      <div id="loginPanel">
        <h1>Preshy Store Admin</h1>
        <div class="login-form">
          <div class="field">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="your@email.com">
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Your password">
          </div>
          <button onclick="login()">Log In</button>
          <button class="secondary" onclick="toggleSignup()">Create Account</button>
        </div>

        <!-- Sign Up Form (Hidden) -->
        <div id="signupForm" class="hidden" style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #ddd;">
          <h3 style="margin-bottom: 15px;">Create New Account</h3>
          <div class="login-form">
            <div class="field">
              <label>Email</label>
              <input type="email" id="signupEmail" placeholder="your@email.com">
            </div>
            <div class="field">
              <label>Password</label>
              <input type="password" id="signupPassword" placeholder="At least 6 characters">
            </div>
            <button onclick="signup()">Sign Up</button>
            <button class="secondary" onclick="toggleSignup()">Back to Login</button>
          </div>
        </div>
      </div>

      <!-- Admin Panel -->
      <div id="adminPanel" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h1>Manage Products</h1>
          <button class="secondary" onclick="logout()">Log Out</button>
        </div>

        <div id="status" class="status hidden"></div>

        <h2 style="margin-bottom: 15px; margin-top: 20px;">Add New Product</h2>
        <div class="login-form">
          <div class="field">
            <label>Product Name</label>
            <input type="text" id="productName" placeholder="e.g., Premium Wig">
          </div>
          <div class="field">
            <label>Price (£)</label>
            <input type="number" id="productPrice" placeholder="49.99" step="0.01">
          </div>
          <div class="field">
            <label>Description</label>
            <textarea id="productDesc" placeholder="Short product description"></textarea>
          </div>
          <div class="field">
            <label>Tag (New / Hot / Best) - Optional</label>
            <input type="text" id="productTag" placeholder="e.g., New">
          </div>
          <div class="field">
            <label>Product Image</label>
            <input type="file" id="productImage" accept="image/*">
            <small>JPG, PNG, or WebP (max 5MB)</small>
          </div>
          <button onclick="addProduct()">Add Product</button>
        </div>

        <h2 style="margin-bottom: 15px; margin-top: 30px;">Your Products</h2>
        <div id="productsList" class="products-list"></div>
      </div>
    </div>
  </div>

  <script>
    // PASTE YOUR FIREBASE CONFIG HERE
    const firebaseConfig = {
      apiKey: "AIzaSyAt6U3b1PpwKT4Ey392t31sEx0OKR8smqw",
      authDomain: "hairbypresshey.firebaseapp.com",
      projectId: "hairbypresshey",
      storageBucket: "hairbypresshey.firebasestorage.app",
      messagingSenderId: "322171823703",
      appId: "1:322171823703:web:5ea4bca2c4d939b4f76512"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    let currentUser = null;

    auth.onAuthStateChanged((user) => {
      currentUser = user;
      if (user) {
        showAdminPanel();
        loadProducts();
      } else {
        showLoginPanel();
      }
    });

    function showLoginPanel() {
      document.getElementById('loginPanel').classList.remove('hidden');
      document.getElementById('adminPanel').classList.add('hidden');
    }

    function showAdminPanel() {
      document.getElementById('loginPanel').classList.add('hidden');
      document.getElementById('adminPanel').classList.remove('hidden');
    }

    function toggleSignup() {
      document.getElementById('signupForm').classList.toggle('hidden');
    }

    function login() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      auth.signInWithEmailAndPassword(email, password).catch((err) => {
        showStatus('Login failed: ' + err.message, 'error');
      });
    }

    function signup() {
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;
      if (password.length < 6) {
        showStatus('Password must be at least 6 characters', 'error');
        return;
      }
      auth.createUserWithEmailAndPassword(email, password).catch((err) => {
        showStatus('Signup failed: ' + err.message, 'error');
      });
    }

    function logout() {
      auth.signOut();
    }

    async function addProduct() {
      const name = document.getElementById('productName').value.trim();
      const price = parseFloat(document.getElementById('productPrice').value);
      const desc = document.getElementById('productDesc').value.trim();
      const tag = document.getElementById('productTag').value.trim() || null;
      const imageFile = document.getElementById('productImage').files[0];

      if (!name || !price || !imageFile) {
        showStatus('Please fill in all fields and select an image', 'error');
        return;
      }

      try {
        let imageUrl = '';
        if (imageFile) {
          const storageRef = storage.ref('products/' + Date.now() + '_' + imageFile.name);
          await storageRef.put(imageFile);
          imageUrl = await storageRef.getDownloadURL();
        }

        const id = Date.now();
        await db.collection('products').doc(id.toString()).set({
          id, name, price, desc, tag, img: imageUrl, createdAt: new Date()
        });

        showStatus('Product added successfully!', 'success');
        document.getElementById('productName').value = '';
        document.getElementById('productPrice').value = '';
        document.getElementById('productDesc').value = '';
        document.getElementById('productTag').value = '';
        document.getElementById('productImage').value = '';
        loadProducts();
      } catch (err) {
        showStatus('Error adding product: ' + err.message, 'error');
      }
    }

    async function loadProducts() {
      const list = document.getElementById('productsList');
      list.innerHTML = '';
      try {
        const snapshot = await db.collection('products').orderBy('createdAt', 'desc').get();
        if (snapshot.empty) {
          list.innerHTML = '<p>No products yet.</p>';
          return;
        }
        snapshot.forEach((doc) => {
          const p = doc.data();
          const item = document.createElement('div');
          item.className = 'product-item';
          item.innerHTML = `
            <img src="${p.img}" alt="${p.name}">
            <div class="product-info">
              <h3>${p.name}</h3>
              <p>£${p.price.toFixed(2)}</p>
            </div>
            <div class="btn-group">
              <button class="secondary" onclick="editProduct('${doc.id}')">Edit</button>
              <button class="danger" onclick="deleteProduct('${doc.id}')">Delete</button>
            </div>
          `;
          list.appendChild(item);
        });
      } catch (err) {
        showStatus('Error loading products: ' + err.message, 'error');
      }
    }

    async function deleteProduct(docId) {
      if (confirm('Delete this product?')) {
        try {
          await db.collection('products').doc(docId).delete();
          showStatus('Product deleted', 'success');
          loadProducts();
        } catch (err) {
          showStatus('Error deleting: ' + err.message, 'error');
        }
      }
    }

    function editProduct(docId) {
      alert('Edit feature coming soon. For now, delete and re-add the product.');
    }

    function showStatus(msg, type) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = msg;
      statusEl.className = 'status ' + type;
      statusEl.classList.remove('hidden');
      setTimeout(() => statusEl.classList.add('hidden'), 4000);
    }
  </script>
</body>
</html>
