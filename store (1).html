<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hair by Preshy</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f8f6f1; color: #333; }
    header { background: #25130e; color: white; padding: 20px; text-align: center; }
    header h1 { margin-bottom: 8px; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin: 30px 0; }
    .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
    .card img { width: 100%; height: 300px; object-fit: cover; }
    .card-content { padding: 16px; }
    .card-name { font-weight: 700; margin-bottom: 8px; }
    .card-price { color: #ff5c8d; font-weight: 700; font-size: 1.2rem; margin-bottom: 8px; }
    .card-desc { font-size: 0.9rem; color: #666; margin-bottom: 12px; }
    .card-tag { display: inline-block; background: #ff5c8d; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; margin-bottom: 12px; }
    button { padding: 10px 16px; background: #ff5c8d; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:hover { background: #f0306d; }
    .admin-link { position: fixed; bottom: 20px; right: 20px; padding: 10px 16px; background: #25130e; color: white; text-decoration: none; border-radius: 6px; font-size: 0.9rem; }
    .loading { text-align: center; padding: 40px; }
  </style>
</head>
<body>
  <header>
    <h1>Hair by Preshy</h1>
    <p>Premium Quality Hair & Wigs</p>
  </header>

  <div class="container">
    <h2 style="margin-top: 20px;">Wigs</h2>
    <div id="wigsGrid" class="grid">
      <div class="loading">Loading...</div>
    </div>

    <h2 style="margin-top: 40px;">Other Products</h2>
    <div id="productsGrid" class="grid">
      <div class="loading">Loading...</div>
    </div>
  </div>

  <a href="firebase-admin.html" class="admin-link">Admin Panel</a>

  <script>
    // PASTE YOUR FIREBASE CONFIG HERE (same as firebase-admin.html)
    const firebaseConfig = {
      apiKey: "AIzaSyAt6U3b1PpwKT4Ey392t31sEx0OKR8smqw",
      authDomain: "hairbypresshey.firebaseapp.com",
      projectId: "hairbypresshey",
      storageBucket: "hairbypresshey.firebasestorage.app",
      messagingSenderId: "322171823703",
      appId: "1:322171823703:web:5ea4bca2c4d939b4f76512"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function renderCard(product) {
      return `
        <div class="card">
          <img src="${product.img}" alt="${product.name}" loading="lazy">
          <div class="card-content">
            ${product.tag ? `<div class="card-tag">${product.tag}</div>` : ''}
            <div class="card-name">${product.name}</div>
            <div class="card-price">£${product.price.toFixed(2)}</div>
            <div class="card-desc">${product.desc || 'Premium quality'}</div>
            <button onclick="alert('Add to cart coming soon!')">View Details</button>
          </div>
        </div>
      `;
    }

    async function loadProducts() {
      try {
        const snapshot = await db.collection('products').orderBy('createdAt', 'desc').get();
        const products = snapshot.docs.map(doc => doc.data());

        const wigsGrid = document.getElementById('wigsGrid');
        const productsGrid = document.getElementById('productsGrid');

        wigsGrid.innerHTML = '';
        productsGrid.innerHTML = '';

        if (products.length === 0) {
          wigsGrid.innerHTML = '<p>No products available yet.</p>';
          return;
        }

        products.forEach((p) => {
          const html = renderCard(p);
          if (p.tag === 'Wig' || p.name.toLowerCase().includes('wig')) {
            wigsGrid.innerHTML += html;
          } else {
            productsGrid.innerHTML += html;
          }
        });

        // If no wigs, show all in products
        if (wigsGrid.innerHTML === '') {
          wigsGrid.innerHTML = '<p>No wigs available.</p>';
        }
        if (productsGrid.innerHTML === '') {
          productsGrid.innerHTML = '<p>No other products available.</p>';
        }
      } catch (err) {
        document.getElementById('wigsGrid').innerHTML = `<p>Error loading products: ${err.message}</p>`;
      }
    }

    loadProducts();

    // Reload when Firestore updates (real-time)
    db.collection('products').onSnapshot(() => {
      loadProducts();
    });
  </script>
</body>
</html>
