backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

publish_mode: editorial_workflow

collections:
  - name: "store"
    label: "Store Data"
    files:
      - file: "store-data.json"
        label: "Store JSON"
        name: "store_json"
        fields:
          - {label: "Wigs", name: "wigData", widget: list, collapsed: false, fields: [
              {label: "ID", name: "id", widget: number},
              {label: "Name", name: "name", widget: string},
              {label: "Price", name: "price", widget: number},
              {label: "Image", name: "img", widget: image},
              {label: "Tag", name: "tag", widget: string, required: false},
              {label: "Description", name: "desc", widget: text, required: false}
            ]}
          - {label: "Products", name: "prodData", widget: list, collapsed: false, fields: [
              {label: "ID", name: "id", widget: number},
              {label: "Name", name: "name", widget: string},
              {label: "Price", name: "price", widget: number},
              {label: "Image", name: "img", widget: image},
              {label: "Tag", name: "tag", widget: string, required: false},
              {label: "Description", name: "desc", widget: text, required: false}
            ]}
